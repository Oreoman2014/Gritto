<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gritto — Shared Progress</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12172B; --teal:#1C7293; --charcoal:#181C1F; --turf:#2F8F4E;
    --paper:#F7F9FB; --slate:#2A3142; --slate-soft:#6B7488; --line:#E4E9EF;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); font-family:'Inter',sans-serif; color:var(--slate); line-height:1.5;}
  .wrap{max-width:480px; margin:0 auto; padding:32px 20px 60px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--slate-soft); margin-bottom:6px;
  }
  h1{
    font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    font-size:26px; margin:0 0 22px; color:var(--ink);
  }
  .card{
    background:#fff; border:1.5px solid var(--line); border-radius:14px;
    padding:16px 18px; margin-bottom:12px;
  }
  .streak-row{display:flex; gap:12px; margin-bottom:12px;}
  .streak-card{
    flex:1; background:var(--charcoal); color:#fff; border-radius:14px; padding:16px;
  }
  .streak-card .label{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:#9AA6C4; margin-bottom:6px;}
  .streak-num{font-family:'IBM Plex Mono',monospace; font-size:28px; font-weight:600; color:#4ECDC4; line-height:1;}
  .streak-lbl{font-size:11px; color:#9AA6C4; margin-top:4px;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .stat-box{background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:14px;}
  .stat-num{font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; color:var(--ink);}
  .stat-lbl{font-size:11px; color:var(--slate-soft); margin-top:2px;}
  .section-label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--slate-soft); margin:20px 0 10px;
  }
  .score-row{display:flex; align-items:center; gap:12px; margin-top:8px;}
  .score-sport{flex:1; font-weight:700; font-size:13.5px; color:var(--ink);}
  .score-count{font-size:11px; color:var(--slate-soft); font-weight:400; margin-left:4px;}
  .score-circle{width:36px; height:36px; border-radius:50%; border:2.5px solid; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; flex-shrink:0;}
  .empty{text-align:center; color:var(--slate-soft); padding:24px; font-size:13px;}
  .note{
    background:#EAF6EE; border-left:4px solid var(--teal); padding:12px 16px;
    border-radius:8px; font-size:12.5px; color:var(--slate); margin-top:24px;
  }
  footer{margin-top:28px; font-size:11.5px; color:var(--slate-soft); text-align:center;}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="eyebrow">Gritto · Shared Progress</div>
  <h1 id="page-title">Loading…</h1>
  <div id="content"></div>
</div>

<script>
function getScoreColor(score){
  const c = Math.max(0, Math.min(100, Math.round(score)));
  if(c >= 80) return '#1F5F35';
  if(c >= 65) return '#1C7293';
  if(c >= 50) return '#B4711A';
  return '#B4401A';
}

async function load(){
  const params = new URLSearchParams(window.location.search);
  const token = params.get('t');
  const titleEl = document.getElementById('page-title');
  const contentEl = document.getElementById('content');

  if(!token){
    titleEl.textContent = 'No share link provided';
    contentEl.innerHTML = '<div class="empty">This page needs a valid share link to show anything.</div>';
    return;
  }

  try{
    const res = await fetch('/api/get-shared-progress?token=' + encodeURIComponent(token));
    const data = await res.json();

    if(!data.ok){
      titleEl.textContent = 'Link not available';
      contentEl.innerHTML = `<div class="empty">${data.error || 'This share link is no longer valid.'}</div>`;
      return;
    }

    titleEl.textContent = `${data.name}'s Progress`;

    const routinesHtml = (data.routines || []).length
      ? data.routines.map(r => `
          <div class="score-row">
            <span class="score-sport">${r.sport}</span>
            <div class="score-circle" style="border-color:${getScoreColor(r.streak > 0 ? 70 : 30)}; color:${getScoreColor(r.streak > 0 ? 70 : 30)};">${r.streak}</div>
          </div>
        `).join('')
      : '<div class="empty">No saved routines yet.</div>';

    const scoresHtml = (data.scoreAverages || []).length
      ? data.scoreAverages.map(s => `
          <div class="score-row">
            <span class="score-sport">${s.sport}<span class="score-count">${s.count} check${s.count === 1 ? '' : 's'}</span></span>
            <div class="score-circle" style="border-color:${getScoreColor(s.avg)}; color:${getScoreColor(s.avg)};">${s.avg}</div>
          </div>
        `).join('')
      : '<div class="empty">No video checks scored yet.</div>';

    contentEl.innerHTML = `
      <div class="streak-row">
        <div class="streak-card">
          <div class="label">Drills streak</div>
          <div class="streak-num">${data.drillsStreak}</div>
          <div class="streak-lbl">days in a row</div>
        </div>
        <div class="streak-card">
          <div class="label">Routine streak</div>
          <div class="streak-num">${data.routineStreak}</div>
          <div class="streak-lbl">days in a row</div>
        </div>
      </div>

      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-num">${data.totalActiveDays}</div>
          <div class="stat-lbl">Total active days</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">${data.drillsTotal}</div>
          <div class="stat-lbl">Drills completed</div>
        </div>
      </div>

      <div class="section-label">Routine streaks by sport</div>
      <div class="card">${routinesHtml}</div>

      <div class="section-label">Average score by sport</div>
      <div class="card">${scoresHtml}</div>

      <div class="note">This is a read-only progress summary shared by the athlete. It updates automatically as they keep practicing.</div>
    `;
  }catch(err){
    titleEl.textContent = 'Something went wrong';
    contentEl.innerHTML = '<div class="empty">Could not load this progress summary right now — try again in a moment.</div>';
    console.error(err);
  }
}

load();
</script>

<footer>Gritto — Train. Fix. Repeat.</footer>
</body>
</html>

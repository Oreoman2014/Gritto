<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gritto Admin — Beta Users</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12172B; --teal:#1C7293; --mint:#4ECDC4; --coral:#FF6B5D;
    --paper:#F7F9FB; --slate:#2A3142; --slate-soft:#6B7488; --line:#E4E9EF;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); font-family:'Inter',sans-serif; color:var(--slate);}
  .wrap{max-width:640px; margin:0 auto; padding:40px 20px;}
  h1{font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; font-size:28px; margin:0 0 4px;}
  .sub{color:var(--slate-soft); font-size:13px; margin:0 0 28px;}

  .login-box{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:24px; max-width:340px; margin:60px auto;
  }
  .login-box input{
    width:100%; border:1.5px solid var(--line); border-radius:10px;
    padding:11px 13px; font-size:14px; margin-bottom:12px;
  }
  .btn{
    background:var(--ink); color:#fff; border:none; font-weight:700;
    font-size:14px; padding:12px; border-radius:10px; cursor:pointer; width:100%;
  }
  .btn.small{width:auto; padding:8px 14px; font-size:12.5px; background:var(--coral);}
  .btn.add{background:var(--teal);}
  .error{color:#B4401A; font-size:12.5px; margin-top:8px; min-height:16px;}

  .hidden{display:none;}

  .add-row{display:flex; gap:8px; margin-bottom:24px;}
  .add-row input{
    flex:1; border:1.5px solid var(--line); border-radius:10px;
    padding:11px 13px; font-size:14px;
  }

  .user-row{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:12px 16px; margin-bottom:8px;
  }
  .user-email{font-size:14px; font-weight:600;}
  .user-date{font-size:11.5px; color:var(--slate-soft); font-family:'IBM Plex Mono',monospace;}
  .empty{color:var(--slate-soft); font-size:13px; text-align:center; padding:30px 0;}

  .tab-row{display:flex; gap:8px; margin-bottom:20px;}
  .tab-btn{
    flex:1; background:#fff; border:1.5px solid var(--line); border-radius:10px;
    padding:10px; font-weight:700; font-size:13px; cursor:pointer; color:var(--slate-soft);
  }
  .tab-btn.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  .feedback-row{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px;
  }
  .feedback-top{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:6px;
  }
  .feedback-email{font-size:13px; font-weight:700;}
  .feedback-date{font-size:11px; color:var(--slate-soft); font-family:'IBM Plex Mono',monospace;}
  .feedback-msg{font-size:13.5px; line-height:1.5; white-space:pre-wrap;}
  .feedback-delete{
    background:none; border:none; color:var(--coral); font-size:11.5px;
    text-decoration:underline; cursor:pointer; margin-top:8px; padding:0;
  }

  .profile-card{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px;
  }
  .profile-top{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .profile-email{font-size:13px; font-weight:700;}
  .profile-sport{
    font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.04em; color:#fff; background:var(--ink);
    padding:3px 9px; border-radius:20px;
  }
  .profile-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:8px 14px;
    font-size:12.5px;
  }
  .profile-field-label{color:var(--slate-soft); font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em;}
  .profile-field-value{font-weight:600;}
  .profile-injury{
    grid-column:1 / -1; margin-top:6px; padding:8px 10px;
    background:#FFF4E5; border-radius:8px; font-size:12.5px;
  }
  .profile-grants-note{
    margin-top:6px; padding:8px 10px;
    background:#EEF2FF; border-radius:8px; font-size:12.5px;
  }
  .profile-grant-section{margin-top:12px;}
  .profile-grant-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:6px 10px;
    background:var(--paper, #F7F9FB); border-radius:8px; padding:10px;
  }
  .profile-grant-checkbox{
    display:flex; align-items:center; gap:5px;
    font-size:11.5px; cursor:pointer;
  }
  .profile-grant-checkbox input{margin:0;}
  .profile-onboard-badge{
    font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.03em; padding:3px 9px; border-radius:20px;
  }
  .profile-onboard-badge.yes{background:#E5F5EA; color:#1F7A3D;}
  .profile-onboard-badge.no{background:#FBE8E8; color:var(--coral);}
  .profile-edit-input{
    width:100%; border:1px solid var(--line); border-radius:8px;
    padding:6px 8px; font-size:12.5px; font-family:inherit;
    box-sizing:border-box; margin-top:2px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="login-box" id="admin-login">
    <h1 style="font-size:20px;">Admin</h1>
    <p class="sub">Enter your admin password to continue.</p>
    <input type="password" id="admin-password-input" placeholder="Admin password">
    <button class="btn" onclick="adminLogin()">Enter</button>
    <div class="error" id="admin-login-error"></div>
  </div>

  <div id="admin-panel" class="hidden">
    <h1>Admin</h1>
    <div class="tab-row">
      <button class="tab-btn active" id="tab-users-btn" onclick="switchTab('users')">Beta Users</button>
      <button class="tab-btn" id="tab-feedback-btn" onclick="switchTab('feedback')">Feedback</button>
      <button class="tab-btn" id="tab-profiles-btn" onclick="switchTab('profiles')">Profiles</button>
    </div>

    <div id="tab-users">
      <p class="sub">People on this list can sign in to Gritto with Google. Everyone else is blocked.</p>
      <div class="add-row">
        <input type="email" id="new-email" placeholder="someone@gmail.com">
        <button class="btn add" style="width:auto; padding:11px 16px;" onclick="addUser()">Add</button>
      </div>
      <div class="error" id="add-error"></div>
      <div id="user-list"></div>
    </div>

    <div id="tab-feedback" class="hidden">
      <p class="sub">Bug reports and feedback sent through the app's Settings page.</p>
      <div id="feedback-list"></div>
    </div>

    <div id="tab-profiles" class="hidden">
      <p class="sub">Onboarding info for every user — sport, goals, position, injury history, and more.</p>
      <div id="profiles-list"></div>
    </div>
  </div>

</div>

<script>
let adminPassword = '';

function adminLogin(){
  adminPassword = document.getElementById('admin-password-input').value;
  document.getElementById('admin-login-error').textContent = '';
  loadUsers();
}

async function loadUsers(){
  try{
    const res = await fetch('/api/admin-users', {
      headers: { 'x-admin-password': adminPassword }
    });
    const data = await res.json();
    if(!data.ok){
      document.getElementById('admin-login-error').textContent = data.error || 'Wrong password.';
      return;
    }
    document.getElementById('admin-login').classList.add('hidden');
    document.getElementById('admin-panel').classList.remove('hidden');
    renderUsers(data.users || []);
  }catch(err){
    document.getElementById('admin-login-error').textContent = 'Something went wrong — try again.';
  }
}

function renderUsers(users){
  const list = document.getElementById('user-list');
  if(users.length === 0){
    list.innerHTML = '<div class="empty">No beta users added yet.</div>';
    return;
  }
  list.innerHTML = users.map(u => `
    <div class="user-row">
      <div>
        <div class="user-email">${u.email}</div>
        <div class="user-date">added ${new Date(u.added_at).toLocaleDateString()}</div>
      </div>
      <button class="btn small" onclick="removeUser('${u.email}')">Remove</button>
    </div>
  `).join('');
}

async function addUser(){
  const emailInput = document.getElementById('new-email');
  const email = emailInput.value.trim();
  const errorEl = document.getElementById('add-error');
  errorEl.textContent = '';
  if(!email){ errorEl.textContent = 'Enter an email first.'; return; }

  try{
    const res = await fetch('/api/admin-users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if(!data.ok){ errorEl.textContent = data.error || 'Could not add that email.'; return; }
    emailInput.value = '';
    loadUsers();
  }catch(err){
    errorEl.textContent = 'Something went wrong — try again.';
  }
}

async function removeUser(email){
  try{
    await fetch('/api/admin-users', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
      body: JSON.stringify({ email })
    });
    loadUsers();
  }catch(err){
    alert('Could not remove that user — try again.');
  }
}

document.getElementById('admin-password-input').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') adminLogin();
});

function switchTab(tab){
  document.getElementById('tab-users').classList.toggle('hidden', tab !== 'users');
  document.getElementById('tab-feedback').classList.toggle('hidden', tab !== 'feedback');
  document.getElementById('tab-profiles').classList.toggle('hidden', tab !== 'profiles');
  document.getElementById('tab-users-btn').classList.toggle('active', tab === 'users');
  document.getElementById('tab-feedback-btn').classList.toggle('active', tab === 'feedback');
  document.getElementById('tab-profiles-btn').classList.toggle('active', tab === 'profiles');
  if(tab === 'feedback') loadFeedback();
  if(tab === 'profiles') loadProfiles();
}

async function loadProfiles(){
  const listEl = document.getElementById('profiles-list');
  listEl.innerHTML = '<div class="empty">Loading…</div>';
  try{
    const res = await fetch('/api/admin-profiles', {
      headers: { 'x-admin-password': adminPassword }
    });
    const data = await res.json();
    if(!data.ok){
      listEl.innerHTML = `<div class="empty">${data.error || 'Could not load profiles.'}</div>`;
      return;
    }
    renderProfiles(data.profiles || []);
  }catch(err){
    listEl.innerHTML = '<div class="empty">Something went wrong — try again.</div>';
  }
}

let currentProfiles = []; // cached so Edit/Cancel can re-render without re-fetching

function renderProfiles(profiles){
  currentProfiles = profiles;
  const listEl = document.getElementById('profiles-list');
  if(profiles.length === 0){
    listEl.innerHTML = '<div class="empty">No profiles yet.</div>';
    return;
  }
  listEl.innerHTML = profiles.map(p => profileCardHTML(p, false)).join('');
}

// Kept in sync with the THEMES/BADGES lists in index.html — just id +
// name, enough to render grant checkboxes here in the admin panel.
const ADMIN_THEMES = [
  { id: 'turf', name: 'Turf' }, { id: 'ocean', name: 'Ocean' }, { id: 'sunset', name: 'Sunset' },
  { id: 'galaxy', name: 'Galaxy' }, { id: 'inferno', name: 'Inferno' }, { id: 'aurora', name: 'Aurora' },
  { id: 'legendary', name: 'Legendary' }, { id: 'diamond', name: 'Diamond' }, { id: 'phoenix', name: 'Phoenix' },
  { id: 'storm', name: 'Storm' }, { id: 'emerald', name: 'Emerald' }, { id: 'nebula', name: 'Nebula' },
  { id: 'solar', name: 'Solar' }, { id: 'celestial', name: 'Celestial' }, { id: 'eternal', name: 'Eternal' },
  { id: 'ironwill', name: 'Iron Will' }, { id: 'directorscut', name: "Director's Cut" }, { id: 'archive', name: 'Archive' },
  { id: 'precision', name: 'Precision' }, { id: 'consistency', name: 'Consistency' }, { id: 'ambassador', name: 'Ambassador' },
  { id: 'allrounder', name: 'All-Rounder' }, { id: 'veteran', name: 'Veteran' }, { id: 'polyglot', name: 'Polyglot' },
  { id: 'grandmaster', name: 'Grandmaster' }, { id: 'original', name: 'Original' },
];
const ADMIN_BADGES = [
  { id: 'first_drill', name: 'First Steps' }, { id: 'drills_10', name: 'Getting Started' },
  { id: 'drills_50', name: 'Dedicated' }, { id: 'drills_100', name: 'Century Club' },
  { id: 'first_video', name: 'Lights, Camera' }, { id: 'video_5', name: 'Film Study' },
  { id: 'video_20', name: 'Tape Junkie' }, { id: 'perfect_score', name: 'Elite Form' },
  { id: 'active_10', name: 'Showing Up' }, { id: 'active_30', name: 'All In' },
  { id: 'multi_sport', name: 'Multi-Sport' },
];

function profileCardHTML(p, editing){
  const uid = p.user_id;
  const positionsStr = (p.positions && p.positions.length) ? p.positions.join(', ') : '';
  const injuryAreasStr = (p.injury_areas && p.injury_areas.length) ? p.injury_areas.join(', ') : '';
  const grantedThemes = p.granted_themes || [];
  const grantedBadges = p.granted_badges || [];

  if(!editing){
    const grantsNote = (grantedThemes.length || grantedBadges.length)
      ? `<div class="profile-grants-note">🎁 Manually granted: ${grantedThemes.length} theme(s), ${grantedBadges.length} badge(s)</div>`
      : '';
    return `
    <div class="profile-card" id="profile-${uid}">
      <div class="profile-top">
        <span class="profile-email">${p.email}</span>
        <div style="display:flex; gap:6px; align-items:center;">
          <span class="profile-onboard-badge ${p.onboarding_completed ? 'yes' : 'no'}">${p.onboarding_completed ? 'Onboarded' : 'Not onboarded'}</span>
          <span class="profile-sport">${p.favorite_sport || '—'}</span>
        </div>
      </div>
      <div class="profile-grid">
        <div><div class="profile-field-label">Goal</div><div class="profile-field-value">${p.main_goal || '—'}</div></div>
        <div><div class="profile-field-label">Experience</div><div class="profile-field-value">${p.experience_level || '—'}</div></div>
        <div><div class="profile-field-label">Coach style</div><div class="profile-field-value">${p.coach_personality || '—'}</div></div>
        <div><div class="profile-field-label">Age range</div><div class="profile-field-value">${p.age_range || '—'}</div></div>
        <div><div class="profile-field-label">Position(s)</div><div class="profile-field-value">${positionsStr || '—'}</div></div>
        <div><div class="profile-field-label">Equipment</div><div class="profile-field-value">${p.equipment_access || '—'}</div></div>
        <div><div class="profile-field-label">Team/solo</div><div class="profile-field-value">${p.team_or_solo || '—'}</div></div>
        <div><div class="profile-field-label">Challenge</div><div class="profile-field-value">${p.biggest_challenge || '—'}</div></div>
        ${p.upcoming_goal ? `<div style="grid-column:1 / -1;"><div class="profile-field-label">Upcoming goal</div><div class="profile-field-value">${p.upcoming_goal}</div></div>` : ''}
      </div>
      ${p.has_prior_injury ? `<div class="profile-injury">⚠️ Reported injury history: ${injuryAreasStr || 'area not specified'}</div>` : ''}
      ${grantsNote}
      <button class="feedback-delete" style="color:var(--ink);" onclick="editProfile('${uid}')">Edit</button>
    </div>
  `;
  }

  // Editing mode — plain text inputs for everything, kept simple and
  // flexible rather than trying to mirror every exact onboarding chip.
  const field = (label, key, value) => `
    <div>
      <div class="profile-field-label">${label}</div>
      <input type="text" class="profile-edit-input" data-field="${key}" value="${(value || '').toString().replace(/"/g, '&quot;')}">
    </div>`;

  const grantCheckboxes = (items, groupName, granted) => items.map(item => `
    <label class="profile-grant-checkbox">
      <input type="checkbox" class="profile-grant-cb" data-group="${groupName}" value="${item.id}" ${granted.includes(item.id) ? 'checked' : ''}>
      ${item.name}
    </label>
  `).join('');

  return `
    <div class="profile-card" id="profile-${uid}">
      <div class="profile-top">
        <span class="profile-email">${p.email}</span>
        <select class="profile-edit-input" data-field="onboarding_completed" style="width:auto;">
          <option value="true" ${p.onboarding_completed ? 'selected' : ''}>Onboarded</option>
          <option value="false" ${!p.onboarding_completed ? 'selected' : ''}>Not onboarded</option>
        </select>
      </div>
      <div class="profile-grid">
        ${field('Sport', 'favorite_sport', p.favorite_sport)}
        ${field('Goal', 'main_goal', p.main_goal)}
        ${field('Experience', 'experience_level', p.experience_level)}
        ${field('Coach style', 'coach_personality', p.coach_personality)}
        ${field('Age range', 'age_range', p.age_range)}
        ${field('Position(s) — comma separated', 'positions', positionsStr)}
        ${field('Equipment', 'equipment_access', p.equipment_access)}
        ${field('Team/solo', 'team_or_solo', p.team_or_solo)}
        ${field('Challenge', 'biggest_challenge', p.biggest_challenge)}
        ${field('Upcoming goal', 'upcoming_goal', p.upcoming_goal)}
      </div>
      <div style="margin-top:10px;">
        <select class="profile-edit-input" data-field="has_prior_injury" style="width:auto;">
          <option value="false" ${!p.has_prior_injury ? 'selected' : ''}>No injury history</option>
          <option value="true" ${p.has_prior_injury ? 'selected' : ''}>Has injury history</option>
        </select>
        <input type="text" class="profile-edit-input" data-field="injury_areas" placeholder="Injury areas — comma separated" value="${injuryAreasStr}" style="margin-top:6px;">
      </div>
      <div class="profile-grant-section">
        <div class="profile-field-label" style="margin-bottom:6px;">Grant themes (even if not earned)</div>
        <div class="profile-grant-grid">${grantCheckboxes(ADMIN_THEMES, 'themes', grantedThemes)}</div>
      </div>
      <div class="profile-grant-section">
        <div class="profile-field-label" style="margin-bottom:6px;">Grant badges (even if not earned)</div>
        <div class="profile-grant-grid">${grantCheckboxes(ADMIN_BADGES, 'badges', grantedBadges)}</div>
      </div>
      <div style="margin-top:12px; display:flex; gap:10px;">
        <button class="btn" style="width:auto; padding:9px 16px;" onclick="saveProfile('${uid}')">Save</button>
        <button class="feedback-delete" onclick="cancelEditProfile('${uid}')">Cancel</button>
      </div>
    </div>
  `;
}

function editProfile(userId){
  const p = currentProfiles.find(x => x.user_id === userId);
  if(!p) return;
  document.getElementById(`profile-${userId}`).outerHTML = profileCardHTML(p, true);
}

function cancelEditProfile(userId){
  const p = currentProfiles.find(x => x.user_id === userId);
  if(!p) return;
  document.getElementById(`profile-${userId}`).outerHTML = profileCardHTML(p, false);
}

async function saveProfile(userId){
  const card = document.getElementById(`profile-${userId}`);
  const inputs = card.querySelectorAll('.profile-edit-input');
  const updates = {};
  inputs.forEach(el => {
    const key = el.dataset.field;
    let value = el.value;
    if(key === 'positions' || key === 'injury_areas'){
      updates[key] = value.split(',').map(s => s.trim()).filter(Boolean);
    }else if(key === 'onboarding_completed' || key === 'has_prior_injury'){
      updates[key] = value === 'true';
    }else{
      updates[key] = value.trim() || null;
    }
  });

  const grantedThemes = Array.from(card.querySelectorAll('.profile-grant-cb[data-group="themes"]:checked')).map(cb => cb.value);
  const grantedBadges = Array.from(card.querySelectorAll('.profile-grant-cb[data-group="badges"]:checked')).map(cb => cb.value);
  updates.granted_themes = grantedThemes;
  updates.granted_badges = grantedBadges;

  try{
    const res = await fetch('/api/admin-profiles', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
      body: JSON.stringify({ user_id: userId, updates })
    });
    const data = await res.json();
    if(!data.ok){
      alert(data.error || 'Could not save changes.');
      return;
    }
    loadProfiles(); // refresh from the server so the card reflects what actually saved
  }catch(err){
    alert('Something went wrong saving that — try again.');
  }
}

async function loadFeedback(){
  const listEl = document.getElementById('feedback-list');
  listEl.innerHTML = '<div class="empty">Loading…</div>';
  try{
    const res = await fetch('/api/admin-feedback', {
      headers: { 'x-admin-password': adminPassword }
    });
    const data = await res.json();
    if(!data.ok){
      listEl.innerHTML = `<div class="empty">${data.error || 'Could not load feedback.'}</div>`;
      return;
    }
    renderFeedback(data.reports || []);
  }catch(err){
    listEl.innerHTML = '<div class="empty">Something went wrong — try again.</div>';
  }
}

function renderFeedback(reports){
  const listEl = document.getElementById('feedback-list');
  if(reports.length === 0){
    listEl.innerHTML = '<div class="empty">No feedback yet.</div>';
    return;
  }
  listEl.innerHTML = reports.map(r => `
    <div class="feedback-row">
      <div class="feedback-top">
        <span class="feedback-email">${r.email}</span>
        <span class="feedback-date">${new Date(r.created_at).toLocaleString()}</span>
      </div>
      <div class="feedback-msg">${r.message}</div>
      <button class="feedback-delete" onclick="deleteFeedback('${r.id}')">Delete</button>
    </div>
  `).join('');
}

async function deleteFeedback(id){
  if(!confirm('Delete this feedback report?')) return;
  try{
    await fetch('/api/admin-feedback', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
      body: JSON.stringify({ id })
    });
    loadFeedback();
  }catch(err){
    alert('Could not delete that report — try again.');
  }
}
</script>
</body>
</html>
